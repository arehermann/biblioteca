<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Biblioteca{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% if user %}
  <header class="top">
    <a href="/" class="brand">Biblioteca</a>
    <nav>
      <a href="/scan" class="btn primary">📷 Foto de estante</a>
      <a href="/books/new">Agregar</a>
      <a href="/import">Importar</a>
      <form method="post" action="/logout" class="inline"><button class="link">Salir</button></form>
    </nav>
  </header>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
